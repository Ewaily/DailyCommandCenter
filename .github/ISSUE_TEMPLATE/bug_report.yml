name: 🐛 Bug report
description: Something is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the form below — the more detail, the faster we can fix it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I drag the GitHub PRs card to a new grid slot, the layout doesn't persist after reload.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run `npm run dev`
        2. Open http://localhost:3000
        3. Drag card X to position Y
        4. Reload — card returns to original slot
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: v20.11.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Server logs, browser console errors, screenshots. **Redact any tokens.**
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this isn't a duplicate.
          required: true
        - label: I have redacted all secrets from logs and screenshots.
          required: true
