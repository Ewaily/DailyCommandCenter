version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    target-branch: prod
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    groups:
      typescript-tooling:
        patterns:
          - "typescript"
          - "tsx"
          - "@types/*"
      vite-vitest:
        patterns:
          - "vite"
          - "vitest"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: prod
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
