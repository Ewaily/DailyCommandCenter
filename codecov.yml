coverage:
  status:
    project:
      default:
        # Keep overall project coverage at or above current baseline.
        # "auto" targets whatever the base commit had, so new commits
        # can never silently drop global coverage.
        target: auto
        threshold: 1%        # tolerate a 1 % fluctuation (test ordering noise)
    patch:
      default:
        # Patch (diff) coverage is informational only.
        # Many legitimate changes are CSS, HTML templates, or server glue
        # that the jsdom/Node test environment cannot reach. Blocking merges
        # on 0 % patch coverage would produce false positives on every such PR.
        informational: true

comment:
  # Only post a PR comment when coverage actually changes — suppresses
  # noise on commits that only touch docs, config, or CSS.
  require_changes: true
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  require_base: false
  require_head: true
  hide_project_coverage: false

github_checks:
  # Inline file annotations add clutter without actionable value here;
  # the summary comment + status check is enough signal.
  annotations: false

ignore:
  - "src/frontend/main.ts"
  - "src/server/index.ts"
  - "coverage/**"
  - "dist/**"
